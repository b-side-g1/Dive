name: Dive
description: Dive, Record your feeling

publish_to: "none"

version: 2.0.1+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State / data
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  collection: ^1.18.0
  intl: ^0.19.0
  uuid: ^4.4.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0
  flutter_picker_plus: ^1.3.0
  flutter_calendar_carousel: ^2.4.4
  fluttertoast: ^8.2.6

  # Platform
  package_info_plus: ^8.0.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  kakao_flutter_sdk_share: ^1.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - lib/src/image/
    - lib/src/image/splash/
    - lib/src/image/onboarding/
    - lib/src/image/onboarding/2.0x/
    - lib/src/image/onboarding/3.0x/
    - lib/src/image/daily/
    - lib/src/image/daily/2.0x/
    - lib/src/image/daily/3.0x/
    - lib/src/image/bottombar/
    - lib/src/image/drawable-hdpi/
    - lib/src/image/drawable-mdpi/
    - lib/src/image/drawable-xhdpi/
    - lib/src/image/drawable-xxhdpi/
    - lib/src/image/drawable-xxxhdpi/
    - lib/src/image/setting/
    - lib/src/image/tags/
    - lib/src/image/tags/2.0x/
    - lib/src/image/tags/3.0x/
    - assets/images/
    - assets/images/svg/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Bold.otf
          weight: 700
        - asset: assets/fonts/NotoSansKR-Light.otf
          weight: 100

    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/RobotoMono-Light.ttf
          weight: 100
        - asset: assets/fonts/RobotoMono-Medium.ttf
          weight: 300
        - asset: assets/fonts/RobotoMono-Regular.ttf
          weight: 400

    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 100
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
